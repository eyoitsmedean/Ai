name: red_words
description: His words, for this moment. Offline-first Red Words — Jesus's speech in the Gospels.
publish_to: "none"
version: 0.1.0+7

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/moments/catalog.json
  fonts:
    - family: RedWordsSerif
      fonts:
        - asset: assets/fonts/EBGaramond-Regular.ttf
        - asset: assets/fonts/EBGaramond-Italic.ttf
          style: italic
