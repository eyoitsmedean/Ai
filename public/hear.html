<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Red Letter — Hear</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,500&family=Source+Serif+4:ital,wght@0,400;1,400&family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root { --paper:#F4EFE4; --ink:#1B1610; --mute:#7A6E5E; --crimson:#8F1D1D; --gold:#8A6A28; --rule:rgba(27,22,16,.1); }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { min-height:100%; background:var(--paper); color:var(--ink); font-family:'Instrument Sans',system-ui,sans-serif; }
    main { max-width:40rem; margin:0 auto; padding:36px 20px 72px; }
    .watch { letter-spacing:.22em; text-transform:uppercase; font-size:10px; color:var(--gold); margin-bottom:18px; }
    h1 { font-family:Fraunces,Georgia,serif; font-weight:500; font-size:clamp(32px,8vw,48px); letter-spacing:-.03em; }
    h1 em { font-style:italic; color:var(--crimson); }
    .deck { font-family:'Source Serif 4',Georgia,serif; font-style:italic; color:#4A4034; margin:12px 0 28px; max-width:36ch; line-height:1.5; }
    article { margin-top:28px; padding-top:20px; border-top:1px solid var(--rule); }
    .kicker { letter-spacing:.16em; text-transform:uppercase; font-size:11px; color:var(--mute); margin-bottom:8px; }
    .word { font-family:Fraunces,Georgia,serif; font-style:italic; font-size:22px; line-height:1.4; margin:6px 0 8px; }
    .word.kjv { color:var(--crimson); }
    .cite { font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--mute); }
    footer { margin-top:40px; font-size:12px; color:var(--mute); line-height:1.5; }
    footer a { color:var(--crimson); }
  </style>
</head>
<body>
  <main>
    <p class="watch">Watch · hearing desk · not a launch</p>
    <h1>Hear <em>both</em></h1>
    <p class="deck">The live page still speaks King James. These WEBU lines were opened 14 Sep 2026. Recording is not publishing.</p>
    <div id="rows"></div>
    <footer>
      Do not relabel the running app WEB until the spoken files are rebuilt. <a href="/gate">Recording desk</a> · <a href="/ask">Ask</a>
    </footer>
  </main>
  <script>
    fetch('/api/hear').then((r) => r.json()).then((data) => {
      document.getElementById('rows').innerHTML = (data.verses || []).map((v) => {
        const kjv = v.kjv ? '<p class="word kjv">“' + esc(v.kjv) + '”</p><p class="cite">' + esc(v.ref) + ' · KJV · live corpus</p>' : '<p class="cite">No sealed KJV for ' + esc(v.ref) + '</p>';
        const webu = v.webu ? '<p class="word">“' + esc(v.webu) + '”</p><p class="cite">' + esc(v.ref) + ' · WEBU · opened <a href="' + esc(v.webu_url) + '">eBible</a></p>' : '<p class="cite">WEBU not opened for this verse</p>';
        return '<article><p class="kicker">' + esc(v.ref) + '</p>' + kjv + webu + '</article>';
      }).join('');
    }).catch(() => {
      document.getElementById('rows').textContent = 'The hearing desk could not be set.';
    });
    function esc(s) {
      return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
  </script>
</body>
</html>
