<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Red Letter — Leaf</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="description" content="One sitting, one sheet. Not a launch." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,500&family=Source+Serif+4:ital,wght@0,400;1,400&family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --paper: #F4EFE4;
      --ink: #1B1610;
      --mute: #7A6E5E;
      --crimson: #8F1D1D;
      --gold: #8A6A28;
      --rule: rgba(27, 22, 16, 0.12);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: var(--paper); color: var(--ink); }
    body { font-family: 'Instrument Sans', system-ui, sans-serif; }
    .sheet {
      max-width: 36rem;
      margin: 0 auto;
      padding: 36px 22px 72px;
      min-height: 100vh;
    }
    .watch {
      letter-spacing: .22em; text-transform: uppercase; font-size: 10px;
      color: var(--gold); margin-bottom: 22px;
    }
    .mark {
      width: 36px; height: 36px; margin-bottom: 16px;
      border: 1px solid var(--crimson); border-radius: 50%;
      display: grid; place-items: center;
      font-family: Fraunces, Georgia, serif; font-style: italic;
      font-size: 18px; color: var(--crimson);
    }
    h1 {
      font-family: Fraunces, Georgia, serif; font-weight: 500;
      font-size: clamp(32px, 8vw, 48px); letter-spacing: -.03em; line-height: .95;
    }
    h1 em { font-style: italic; color: var(--crimson); }
    .kicker {
      letter-spacing: .16em; text-transform: uppercase;
      font-size: 11px; color: var(--mute); margin: 28px 0 8px;
    }
    .asked {
      font-family: 'Source Serif 4', Georgia, serif; font-style: italic;
      font-size: 18px; line-height: 1.45; color: #3A3228;
    }
    .word {
      font-family: Fraunces, Georgia, serif; font-style: italic;
      font-size: clamp(20px, 4.2vw, 26px); color: var(--crimson);
      line-height: 1.4; margin: 8px 0 6px;
    }
    .cite { letter-spacing: .14em; text-transform: uppercase; font-size: 11px; color: var(--mute); }
    .imply {
      font-family: 'Source Serif 4', Georgia, serif;
      font-size: 17px; line-height: 1.55; color: #3A3228;
      white-space: pre-wrap;
    }
    .amen {
      font-family: Fraunces, Georgia, serif; font-style: italic;
      font-size: 28px; color: var(--crimson); margin-top: 28px;
    }
    .cannot { font-size: 13px; line-height: 1.5; color: var(--mute); margin-top: 32px; }
    .cannot a { color: var(--crimson); }
    .crisis {
      font-family: 'Source Serif 4', Georgia, serif;
      font-size: 18px; line-height: 1.5; white-space: pre-wrap;
    }
    .empty {
      font-family: 'Source Serif 4', Georgia, serif; font-style: italic;
      color: #4A4034; max-width: 32ch; line-height: 1.5; margin-top: 12px;
    }
    .screen-only { margin-top: 28px; }
    .print {
      border: none; background: var(--crimson); color: #FBF7EE;
      padding: 12px 18px; letter-spacing: .08em; text-transform: uppercase;
      font-size: 12px; cursor: pointer;
    }
    .print[hidden], .hidden { display: none !important; }
    footer { margin-top: 28px; font-size: 12px; color: var(--mute); }
    footer a { color: var(--crimson); }
    @page { size: letter; margin: 0.7in; }
    @media print {
      html, body { background: #fff; }
      .sheet { padding: 0; max-width: none; min-height: 0; }
      .screen-only, footer { display: none !important; }
    }
  </style>
</head>
<body>
  <article class="sheet" id="sheet">
    <p class="watch">Watch · one sitting · not a launch</p>
    <div class="mark" aria-hidden="true">R</div>
    <h1>A <em>leaf</em></h1>
    <div id="body">
      <p class="empty">Ask from the one-screen first. The leaf stays blank until a sitting is set on this device.</p>
    </div>
    <div class="screen-only">
      <button class="print" type="button" id="print" hidden>Print this sheet</button>
    </div>
    <footer>
      This sheet is not a URL. Do not publish. <a href="/ask">Ask</a> · <a href="/desk">Desk</a>
    </footer>
  </article>
  <script>
    const KEY = 'rla-leaf';
    const body = document.getElementById('body');
    const printBtn = document.getElementById('print');

    function esc(s) {
      return String(s || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function fourLines(text) {
      return String(text || '').split(/\n+/).map((s) => s.trim()).filter(Boolean).slice(0, 4).join('\n');
    }

    function gospelWord(row) {
      if (!row || !row.verse || !row.quote) return null;
      if (!/^(Matthew|Mark|Luke|John) /.test(String(row.verse))) return null;
      return row;
    }

    let raw = null;
    try { raw = JSON.parse(sessionStorage.getItem(KEY) || 'null'); } catch (_) { raw = null; }

    const crisis = raw && raw.crisis === true;
    const words = crisis ? [] : ((raw && raw.words) || []).map(gospelWord).filter(Boolean).slice(0, 2);
    const asked = raw && String(raw.q || '').trim();
    const printable = crisis ? Boolean(raw.notice) : words.length > 0;

    if (!raw || !printable) {
      body.innerHTML = '<p class="empty">Ask from the one-screen first. The leaf stays blank until a sitting is set on this device.</p>';
    } else if (crisis) {
      body.innerHTML =
        (asked ? '<p class="kicker">Asked</p><p class="asked">' + esc(asked) + '</p>' : '') +
        '<p class="kicker">Stop here</p><p class="crisis" id="crisis-text">' + esc(raw.notice) + '</p>' +
        '<p class="cannot">A person, not this sheet. In the United States, <a href="tel:988">call or text 988</a>. Elsewhere, start at <a href="https://findahelpline.com">findahelpline.com</a>.</p>';
      printBtn.hidden = false;
    } else {
      body.innerHTML =
        (asked ? '<p class="kicker">Asked</p><p class="asked">' + esc(asked) + '</p>' : '') +
        '<p class="kicker">The words</p>' +
        words.map((w) => (
          '<p class="word">“' + esc(w.quote) + '”</p>' +
          '<p class="cite">' + esc(w.verse) + '  ·  ' + esc(w.translation || 'KJV') + '</p>'
        )).join('') +
        (fourLines(raw.implication)
          ? '<p class="kicker">What that might mean today</p><p class="imply" id="imply">' + esc(fourLines(raw.implication)) + '</p>'
          : '') +
        '<p class="amen">Amen.</p>' +
        '<p class="cannot">This is not a pastor. Quoted speech is King James, public domain in the United States. Nothing on this sheet was invented.</p>';
      printBtn.hidden = false;
    }

    printBtn.addEventListener('click', () => window.print());
  </script>
</body>
</html>
