<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Red Letter — The words He actually spoke</title>
  <meta name="description" content="A quiet reading room for the direct words of Jesus. Not another Bible app." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,500&family=Source+Serif+4:ital,wght@0,400;1,400&family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root { --paper:#F4EFE4; --ink:#1B1610; --crimson:#8F1D1D; --mute:#7A6E5E; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; background: var(--paper); color: var(--ink); font-family: 'Instrument Sans', system-ui, sans-serif; }
    .grain { pointer-events:none; position:fixed; inset:0; opacity:.04; background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"); }
    main { min-height: 100dvh; display:flex; align-items:center; justify-content:center; padding: 48px 24px; text-align:center; }
    .kicker { letter-spacing:.28em; text-transform:uppercase; font-size:11px; color:var(--mute); margin-bottom:16px; }
    h1 { font-family: Fraunces, Georgia, serif; font-weight:500; font-size: clamp(48px, 10vw, 84px); letter-spacing:-.03em; line-height:.95; }
    h1 em { font-style:italic; color:var(--crimson); }
    .deck { font-family: 'Source Serif 4', Georgia, serif; font-style:italic; font-size:20px; color:#4A4034; max-width:28ch; margin: 22px auto 36px; line-height:1.5; }
    .quote { font-family: Fraunces, Georgia, serif; font-style:italic; font-size: clamp(22px, 4vw, 28px); color:var(--crimson); max-width:22ch; margin: 0 auto 12px; line-height:1.4; }
    .cite { letter-spacing:.16em; text-transform:uppercase; font-size:12px; color:var(--mute); margin-bottom:40px; }
    a.btn { display:inline-block; background:var(--crimson); color:#FBF7EE; text-decoration:none; padding:14px 22px; letter-spacing:.06em; text-transform:uppercase; font-size:13px; }
    p.note { margin-top:20px; font-size:13px; color:var(--mute); line-height:1.55; }
    p.note a { color:var(--crimson); }
  </style>
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <main>
    <div>
      <div class="kicker">A reading room</div>
      <h1>Red <em>Letter</em></h1>
      <p class="deck">Daily guidance from the words Jesus actually spoke.</p>
      <p class="quote">Peace I leave with you, my peace I give unto you.</p>
      <p class="cite">John 14:27  ·  KJV</p>
      <a class="btn" href="./public/">Open the room</a>
      <p class="note">The full Advisor is a small Node app. Run <code>npm start</code>.<br>Not a person, and not therapy. Crisis: <a href="tel:988">988</a> (U.S.) · <a href="https://findahelpline.com">findahelpline.com</a>.</p>
    </div>
  </main>
</body>
</html>
