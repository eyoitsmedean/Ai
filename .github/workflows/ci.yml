name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    name: Smoke (server + PWA + push + corpus lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start server (corpus mode)
        run: |
          PORT=3000 PUSH_STORE=/tmp/push-store.json node server.js > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/api/health && break
            sleep 1
          done
      - run: node scripts/smoke.js http://localhost:3000
      - name: Evaluation set (53 questions incl. crisis, abuse, off-scope, hostile)
        run: BASE_URL=http://localhost:3000 node scripts/eval.js --strict
      - if: failure()
        run: cat server.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: |
            eval/RESULTS.md
            eval/results.json

  corpus:
    name: Every quote verbatim against WEB (bible-api)
    runs-on: ubuntu-latest
    # Depends on a third-party API; advisory so a rate limit cannot block a merge.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify:corpus
