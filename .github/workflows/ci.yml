name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
      - name: Evaluate the Advisor (server composer)
        run: node scripts/eval.js
      - name: Evaluate the Advisor (client composer, static hosting)
        run: node scripts/eval.js --client
      - name: Smoke the live server
        run: |
          node server.js &
          pid=$!
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:3000/api/health >/dev/null; then
              break
            fi
            sleep 0.25
          done
          node scripts/smoke.js http://127.0.0.1:3000
          kill "$pid"
