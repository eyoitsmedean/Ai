name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/jesus-teachings-chatbot-bSBhF
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
        continue-on-error: true
        id: pages-setup

      - name: Upload artifact
        if: steps.pages-setup.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        if: steps.pages-setup.outcome == 'success'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Pages not enabled
        if: steps.pages-setup.outcome != 'success'
        run: |
          echo "::notice::GitHub Pages is not enabled for this repo (Settings → Pages → GitHub Actions)."
          echo "Skipping deploy. Feature branches do not require Pages."
