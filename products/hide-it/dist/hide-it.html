:root {
  --paper: #f6f3ee;
  --paper-2: #e9e3da;
  --card: #fcfaf7;
  --ink: #23201d;
  --ink-2: #4a443e;
  --muted: #6f675e;
  --line: #ddd5c9;
  --line-2: #cfc5b7;
  --red: #a3142c;
  --red-ink: #8d1126;
  --red-soft: #f4e4e2;
  --red-wash: rgba(163, 20, 44, 0.08);
  --on-red: #fdf8f4;
  --ok: #3d6b4a;
  --ok-soft: #e4eee4;
  --shadow: 0 1px 0 rgba(35, 32, 29, 0.04), 0 8px 24px -16px rgba(35, 32, 29, 0.25);
  --focus: 0 0 0 3px var(--paper), 0 0 0 5px var(--red);
  --display: "IM Fell English", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --text: "Literata", "Iowan Old Style", "Charter", Georgia, Cambria, "Times New Roman", serif;
  --radius: 14px;
  --ease: cubic-bezier(.2, .7, .2, 1);
  --tab-on: var(--card);
  --tab-edge: transparent;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #171513;
    --paper-2: #22201c;
    --card: #1f1c19;
    --ink: #eee7dc;
    --ink-2: #d2c9bc;
    --muted: #a59b8e;
    --line: #36312b;
    --line-2: #4a433b;
    --red: #e8838e;
    --red-ink: #f0a0a8;
    --red-soft: #3a2124;
    --red-wash: rgba(232, 131, 142, 0.12);
    --on-red: #1a1012;
    --ok: #9fcfa9;
    --ok-soft: #22302a;
    --shadow: 0 1px 0 rgba(0, 0, 0, 0.3), 0 10px 30px -18px rgba(0, 0, 0, 0.8);
    --tab-on: #302b26;
    --tab-edge: var(--line-2);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #171513;
  --paper-2: #22201c;
  --card: #1f1c19;
  --ink: #eee7dc;
  --ink-2: #d2c9bc;
  --muted: #a59b8e;
  --line: #36312b;
  --line-2: #4a433b;
  --red: #e8838e;
  --red-ink: #f0a0a8;
  --red-soft: #3a2124;
  --red-wash: rgba(232, 131, 142, 0.12);
  --on-red: #1a1012;
  --ok: #9fcfa9;
  --ok-soft: #22302a;
  --shadow: 0 1px 0 rgba(0, 0, 0, 0.3), 0 10px 30px -18px rgba(0, 0, 0, 0.8);
  --tab-on: #302b26;
  --tab-edge: var(--line-2);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--text);
  font-size: 17px;
  line-height: 1.55;
  font-variant-numeric: lining-nums proportional-nums;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  overflow-x: hidden;
}
h1, h2, h3 { font-family: var(--display); font-weight: 400; line-height: 1.15; margin: 0; letter-spacing: 0.005em; }
p { margin: 0; }
a { color: var(--red-ink); }
button, input, textarea, select { font: inherit; color: inherit; }
:focus { outline: none; }
:focus-visible { box-shadow: var(--focus); border-radius: 8px; }
.sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.skip { position: absolute; left: 12px; top: -60px; background: var(--ink); color: var(--paper); padding: 10px 14px; border-radius: 8px; z-index: 10; text-decoration: none; }
.skip:focus { top: 12px; }
.noscript { max-width: 640px; margin: 40px auto; padding: 0 16px; }

/* Masthead */
.masthead { border-bottom: 1px solid var(--line); background: var(--paper); position: sticky; top: 0; z-index: 5; }
.masthead-inner { max-width: 760px; margin: 0 auto; padding: 18px 20px 6px; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.brand { text-decoration: none; color: var(--ink); display: flex; flex-direction: column; gap: 2px; min-width: 0; border-radius: 6px; }
.brand-kicker { font-family: var(--text); font-size: 11px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; color: var(--red); }
.brand-title { font-family: var(--display); font-size: 26px; line-height: 1.1; white-space: nowrap; }
.streak-pill { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; white-space: nowrap; padding-bottom: 4px; }
.streak-pill .flame { width: 8px; height: 8px; border-radius: 50%; background: var(--red); display: inline-block; }
.streak-pill.zero .flame { background: transparent; border: 1.5px solid var(--line-2); }
.tabs { max-width: 760px; margin: 0 auto; padding: 0 12px; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs a { position: relative; padding: 10px 10px 12px; color: var(--muted); text-decoration: none; font-size: 15px; white-space: nowrap; border-radius: 8px 8px 0 0; }
.tabs a:hover { color: var(--ink); }
.tabs a[aria-current="page"] { color: var(--ink); font-weight: 600; }
.tabs a[aria-current="page"]::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: -1px; height: 2px; background: var(--red); border-radius: 2px; }

main { max-width: 760px; margin: 0 auto; padding: 28px 20px 96px; }
main:focus, h1[tabindex="-1"]:focus { box-shadow: none; }

/* Common blocks */
.view-title { font-size: 34px; margin-bottom: 6px; }
.lede { color: var(--muted); max-width: 34em; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; box-shadow: var(--shadow); }
.card + .card { margin-top: 16px; }
.card h2 { font-size: 24px; margin-bottom: 8px; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.muted { color: var(--muted); }
.small { font-size: 14.5px; }
.stack > * + * { margin-top: 12px; }
.row-gap { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.spacer { height: 16px; }

.btn { appearance: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 10px 20px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--card); color: var(--ink); font-size: 16px; font-weight: 500; cursor: pointer; text-decoration: none; transition: background .15s, border-color .15s, transform .15s var(--ease); line-height: 1.2; text-align: center; }
.btn:hover { border-color: var(--ink-2); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--red); border-color: var(--red); color: var(--on-red); }
.btn.primary:hover { background: var(--red-ink); border-color: var(--red-ink); }
.btn.quiet { border-color: transparent; background: transparent; color: var(--muted); padding-left: 12px; padding-right: 12px; }
.btn.quiet:hover { color: var(--ink); background: var(--red-wash); }
.btn[disabled] { opacity: .45; cursor: default; transform: none; }
.btn .arrow { font-family: var(--text); }
.back { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); text-decoration: none; font-size: 15px; padding: 6px 8px 6px 2px; margin-left: -2px; border-radius: 8px; }
.back:hover { color: var(--ink); }

/* Today */
.epigraph { font-family: var(--display); font-style: italic; font-size: 25px; line-height: 1.35; color: var(--ink-2); max-width: 26em; margin-bottom: 26px; }
.today-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.today-grid .card + .card { margin-top: 0; }
.today-grid .wide { grid-column: 1 / -1; }
.bignum { font-family: var(--text); font-size: 56px; font-weight: 400; line-height: 1; color: var(--red); letter-spacing: -0.02em; margin: 6px 0 8px; font-variant-numeric: lining-nums tabular-nums; }
.bignum small { font-size: 18px; color: var(--muted); letter-spacing: 0; margin-left: 6px; }
.card > .btn { margin-top: 16px; }
.next-saying { border-left: 2px solid var(--red); padding: 2px 0 2px 14px; margin-top: 12px; }
.next-saying .cue { font-family: var(--display); font-style: italic; font-size: 21px; line-height: 1.3; }
.ref { font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.welcome { background: linear-gradient(180deg, var(--card), var(--card)) padding-box; }
.welcome p + p { margin-top: 10px; }
.week { display: flex; gap: 8px; margin: 14px 0 10px; }
.week .day { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.week .dot { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--line-2); }
.week .day.done .dot { background: var(--red); border-color: var(--red); }
.week .day.grace .dot { border-color: var(--red); border-style: dashed; }
.week .day.today { color: var(--ink); font-weight: 600; }

/* Sayings list */
.collection { margin-top: 36px; }
.collection:first-of-type { margin-top: 26px; }
.collection-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; border-bottom: 1px solid var(--line); padding-bottom: 10px; margin-bottom: 4px; flex-wrap: wrap; }
.collection-head h2 { font-size: 28px; }
.collection-head .count { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.collection .blurb { color: var(--muted); font-size: 15px; margin: 8px 0 6px; }
.saying-list { list-style: none; margin: 0; padding: 0; }
.saying-list li { border-bottom: 1px solid var(--line); padding: 3px 0; }
.saying-list li:last-child { border-bottom: 0; }
.saying-row { display: grid; grid-template-columns: 1fr auto; gap: 6px 16px; align-items: center; padding: 11px 10px; margin: 0 -10px; text-decoration: none; color: inherit; border-radius: 10px; }
.saying-row:hover { background: var(--red-wash); }
.saying-row .words { font-family: var(--display); font-size: 20px; line-height: 1.3; color: var(--red); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.saying-row .meta { grid-column: 1; font-size: 13.5px; color: var(--muted); }
.saying-row .meta .ref { font-size: 12px; }
.saying-row .pips { grid-row: 1 / span 2; grid-column: 2; }
.pips { display: inline-flex; gap: 4px; align-items: center; }
.pips i { width: 7px; height: 7px; border-radius: 50%; border: 1.25px solid var(--line-2); display: block; }
.pips i.on { background: var(--red); border-color: var(--red); }

/* Practice */
.saying-head { margin: 14px 0 18px; }
.saying-head .cue { font-family: var(--display); font-style: italic; font-size: 24px; line-height: 1.25; color: var(--ink-2); }
.saying-head .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-top: 8px; }
.badge { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.modes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; background: var(--paper-2); padding: 5px; border-radius: 14px; margin-bottom: 16px; }
.mode-tab { appearance: none; border: 0; background: transparent; border-radius: 10px; min-height: 52px; padding: 8px 4px; cursor: pointer; color: var(--muted); display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 2px; font-size: 14px; line-height: 1.15; text-align: center; text-decoration: none; }
.mode-tab .n { font-size: 12px; letter-spacing: .08em; font-variant-numeric: tabular-nums; }
.mode-tab .n .tick { color: var(--ok); font-weight: 700; }
.mode-tab:hover { color: var(--ink); }
.mode-tab[aria-current="step"] { background: var(--tab-on); color: var(--ink); font-weight: 600; box-shadow: inset 0 0 0 1px var(--tab-edge), var(--shadow); }
.stage { padding: 26px 24px 22px; }
.instructions { color: var(--muted); font-size: 15px; margin-bottom: 20px; max-width: 36em; }
.saying-text { font-family: var(--display); font-size: 31px; line-height: 1.42; color: var(--red); margin: 0 0 6px; word-spacing: 0.02em; hyphens: none; overflow-wrap: break-word; }
.saying-text.size-m { font-size: 27px; }
.saying-text.size-l { font-size: 24px; }
.saying-text .trail { color: var(--muted); }
.saying-text .ph { transition: opacity .35s var(--ease), filter .35s var(--ease); }
.saying-text .ph.covered { color: transparent; background: repeating-linear-gradient(0deg, transparent 0 .32em, var(--red-wash) .32em 1.18em, transparent 1.18em 1.42em); border-radius: 4px; user-select: none; }
.saying-text .ph.next { outline: 1.5px dashed var(--line-2); outline-offset: 2px; border-radius: 4px; }
.cite { margin-top: 14px; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 22px; }
.controls .grow { flex: 1; }
.counter { white-space: nowrap; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }

.blank { appearance: none; display: inline-block; vertical-align: baseline; border: 0; padding: 0; margin: 0; background: var(--red-wash); border-bottom: 2px solid var(--red); border-radius: 3px 3px 0 0; height: 0.95em; cursor: pointer; transform: translateY(0.12em); color: var(--red); font: inherit; line-height: 1; }
.blank.peek { background: transparent; border-bottom-color: var(--line-2); height: auto; transform: none; color: var(--muted); }
.blank:focus-visible { box-shadow: var(--focus); }
.fl { white-space: nowrap; }
.fl .rest { display: inline-block; height: 0.1em; border-bottom: 2px dotted var(--line-2); margin-left: 0.06em; transform: translateY(-0.02em); }

.type-area { display: block; overflow: hidden; width: 100%; min-height: 96px; resize: none; padding: 14px 16px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--paper); font-family: var(--text); font-size: 18px; line-height: 1.5; margin-top: 18px; }
.type-area:focus-visible { border-color: var(--red); box-shadow: 0 0 0 3px var(--red-wash); }
.field-label { display: block; font-size: 14px; color: var(--muted); margin-top: 18px; }
.field-label + .type-area { margin-top: 6px; }
.kbd-hint { font-size: 13px; color: var(--muted); }

.result { margin-top: 18px; padding: 16px 18px; border-radius: 12px; background: var(--paper-2); }
.result.perfect { background: var(--ok-soft); }
.result .verdict { font-weight: 600; }
.result .score { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.diff { font-family: var(--display); font-size: 22px; line-height: 1.5; margin-top: 10px; color: var(--ink); }
.diff .w-missed { color: var(--red); text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px; background: var(--red-wash); border-radius: 3px; padding: 0 2px; }
.diff .w-near { text-decoration: underline dotted; text-decoration-thickness: 1.5px; text-underline-offset: 4px; }
.extra { margin-top: 10px; font-size: 14.5px; color: var(--muted); }
.extra s { color: var(--ink-2); }

.built { min-height: 64px; padding: 14px 16px; border-radius: 12px; border: 1.5px dashed var(--line-2); font-family: var(--display); font-size: 25px; line-height: 1.45; color: var(--red); }
.built:empty::before { content: attr(data-empty); font-family: var(--text); font-size: 15px; color: var(--muted); }
.built.done { border-style: solid; border-color: var(--ok); background: var(--ok-soft); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.chip { appearance: none; border: 1px solid var(--line-2); background: var(--card); border-radius: 10px; min-height: 44px; padding: 6px 14px; font-family: var(--display); font-size: 20px; line-height: 1.2; cursor: pointer; color: var(--ink); transition: transform .15s var(--ease), background .15s; }
.chip:hover { border-color: var(--red); background: var(--red-wash); }
.chip.wrong { animation: shake .36s var(--ease); border-color: var(--red); }
@keyframes shake { 20% { transform: translateX(-5px); } 45% { transform: translateX(4px); } 70% { transform: translateX(-2px); } 100% { transform: none; } }

.feedback { min-height: 1.5em; margin-top: 14px; font-size: 15.5px; color: var(--ink-2); }
.feedback.good { color: var(--ok); font-weight: 600; }
.complete { margin-top: 18px; display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; padding-top: 18px; border-top: 1px solid var(--line); }
.complete .msg { flex: 1 1 220px; font-weight: 600; color: var(--ok); }
.complete .msg span { display: block; font-weight: 400; color: var(--muted); font-size: 14.5px; }

/* Review */
.review-cue { font-family: var(--display); font-style: italic; font-size: 30px; line-height: 1.25; margin: 8px 0 6px; }
.review-prompt { color: var(--muted); }
.rate { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
.rate .btn { flex-direction: column; border-radius: 14px; min-height: 72px; padding: 10px 8px; margin: 0; gap: 2px; }
.rate .btn span { font-size: 12.5px; font-weight: 400; opacity: .8; }
.progress-line { height: 4px; border-radius: 4px; background: var(--paper-2); overflow: hidden; margin: 6px 0 18px; }
.progress-line i { display: block; height: 100%; background: var(--red); border-radius: 4px; transition: width .4s var(--ease); }

/* Progress */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 22px 0 8px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
.stat .num { font-size: 36px; line-height: 1; color: var(--red); font-variant-numeric: lining-nums tabular-nums; }
.stat .lbl { font-size: 13.5px; color: var(--muted); margin-top: 8px; line-height: 1.35; }
.bars { list-style: none; margin: 0; padding: 0; }
.bars li { display: grid; grid-template-columns: 9.5em 1fr 3.4em; gap: 12px; align-items: center; padding: 8px 0; font-size: 15px; }
.bars .bar { height: 10px; border-radius: 6px; background: var(--paper-2); display: flex; overflow: hidden; gap: 1px; }
.bars .bar i { display: block; height: 100%; background: var(--red); }
.bars .n { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 14px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); margin-top: 10px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; background: var(--red); display: inline-block; }
.upcoming { list-style: none; margin: 0; padding: 0; }
.upcoming li { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.upcoming li:last-child { border-bottom: 0; }
.upcoming .when { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.setting { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.setting:last-child { border-bottom: 0; }
.seg { display: inline-flex; background: var(--paper-2); border-radius: 999px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { appearance: none; border: 0; background: transparent; border-radius: 999px; padding: 7px 12px; min-height: 38px; font-size: 14px; cursor: pointer; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); font-weight: 600; box-shadow: var(--shadow); }
.switch { appearance: none; width: 48px; height: 28px; border-radius: 999px; background: var(--line-2); position: relative; cursor: pointer; border: 0; flex: none; transition: background .2s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--card); transition: transform .2s var(--ease); box-shadow: 0 1px 2px rgba(0,0,0,.25); }
.switch[aria-checked="true"] { background: var(--red); }
.switch[aria-checked="true"]::after { transform: translateX(20px); }
.stepper { display: inline-flex; align-items: center; gap: 4px; }
.stepper button { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line-2); background: var(--card); cursor: pointer; font-size: 18px; line-height: 1; }

.danger { color: var(--red-ink); }
.confirm { margin-top: 12px; padding: 14px 16px; border-radius: 12px; background: var(--red-soft); }

/* About */
.prose p { max-width: 36em; }
.prose p + p { margin-top: 14px; }
.colophon { margin-top: 28px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 14px; color: var(--muted); }
.colophon p + p { margin-top: 6px; }

/* Toast */
.toast { position: fixed; left: 0; right: 0; margin-inline: auto; width: max-content; top: 14px; transform: translateY(-16px); background: var(--ink); color: var(--paper); padding: 12px 18px; border-radius: 12px; font-size: 15px; max-width: min(92vw, 460px); opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s var(--ease); z-index: 20; box-shadow: 0 10px 30px -10px rgba(0,0,0,.4); }
.toast.show { opacity: 1; transform: translateY(0); }

.view-enter { animation: rise .35s var(--ease); }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

}

}

d."},{"id":"poor-in-spirit","ref":"Matthew 5:3","cue":"Blessed are the poor in spirit","text":"Blessed are the poor in spirit: for theirs is the kingdom of heaven."},{"id":"peacemakers","ref":"Matthew 5:9","cue":"Blessed are the peacemakers","text":"Blessed are the peacemakers: for they shall be called the children of God."},{"id":"hunger-thirst","ref":"Matthew 5:6","cue":"Blessed are they which do hunger","text":"Blessed are they which do hunger and thirst after righteousness: for they shall be filled."}]},{"id":"i-am","name":"I Am","blurb":"Seven ways he named himself in the Gospel of John.","sayings":[{"id":"good-shepherd","ref":"John 10:11","cue":"The shepherd and the sheep","text":"I am the good shepherd: the good shepherd giveth his life for the sheep."},{"id":"way-truth-life","ref":"John 14:6","cue":"An answer to Thomas: how can we know the way?","text":"I am the way, the truth, and the life: no man cometh unto the Father, but by me."},{"id":"resurrection","ref":"John 11:25","cue":"To Martha, outside Bethany","text":"I am the resurrection, and the life: he that believeth in me, though he were dead, yet shall he live:"},{"id":"bread-of-life","ref":"John 6:35","cue":"The day after the loaves and fishes","text":"I am the bread of life: he that cometh to me shall never hunger; and he that believeth on me shall never thirst."},{"id":"light-of-world","ref":"John 8:12","cue":"Teaching in the temple","text":"I am the light of the world: he that followeth me shall not walk in darkness, but shall have the light of life."},{"id":"door","ref":"John 10:9","cue":"The door of the sheepfold","text":"I am the door: by me if any man enter in, he shall be saved, and shall go in and out, and find pasture."},{"id":"vine-branches","ref":"John 15:5","cue":"Abiding in the vine","text":"I am the vine, ye are the branches: He that abideth in me, and I in him, the same bringeth forth much fruit: for without me ye can do nothing."}]},{"id":"comfort","name":"Comfort","blurb":"Words for hard days, to have ready before you need them.","sayings":[{"id":"rest-a-while","ref":"Mark 6:31","cue":"To his tired friends, after a long day","text":"Come ye yourselves apart into a desert place, and rest a while."},{"id":"with-you-alway","ref":"Matthew 28:20","cue":"His last words in Matthew","text":"I am with you alway, even unto the end of the world."},{"id":"heart-troubled","ref":"John 14:1","cue":"At the last supper","text":"Let not your heart be troubled: ye believe in God, believe also in me."},{"id":"little-flock","ref":"Luke 12:32","cue":"To his friends, who were anxious","text":"Fear not, little flock; for it is your Father's good pleasure to give you the kingdom."},{"id":"come-unto-me","ref":"Matthew 11:28","cue":"An invitation to the weary","text":"Come unto me, all ye that labour and are heavy laden, and I will give you rest."},{"id":"hairs-numbered","ref":"Luke 12:7","cue":"Sparrows, and every hair counted","text":"But even the very hairs of your head are all numbered. Fear not therefore: ye are of more value than many sparrows."},{"id":"many-mansions","ref":"John 14:2","cue":"In his Father's house","text":"In my Father's house are many mansions: if it were not so, I would have told you. I go to prepare a place for you."},{"id":"my-peace","ref":"John 14:27","cue":"A parting gift","text":"Peace I leave with you, my peace I give unto you: not as the world giveth, give I unto you. Let not your heart be troubled, neither let it be afraid."},{"id":"good-cheer","ref":"John 16:33","cue":"At the close of the last supper","text":"These things I have spoken unto you, that in me ye might have peace. In the world ye shall have tribulation: but be of good cheer; I have overcome the world."}]},{"id":"prayer","name":"Prayer","blurb":"The Lord's Prayer, line by line in order, then what he taught about asking.","sayings":[{"prayerLine":true,"id":"our-father","ref":"Matthew 6:9","cue":"The Lord's Prayer: the opening","text":"Our Father which art in heaven, Hallowed be "By this shall all men know that ye are my disciples, if ye have love one to another."},{"id":"great-commandment","ref":"Matthew 22:37","cue":"The first and great commandment","text":"Thou shalt love the Lord thy God with all thy heart, and with all thy soul, and with all thy mind."},{"id":"new-commandment","ref":"John 13:34","cue":"A new commandment","text":"A new commandment I give unto you, That ye love one another; as I have loved you, that ye also love one another."},{"id":"god-so-loved","ref":"John 3:16","cue":"To Nicodemus, at night","text":"For God so loved the world, that he gave his only begotten Son, that whosoever believeth in him should not perish, but have everlasting life."}]},{"id":"seek-first","name":"Seek First","blurb":"On trust, treasure, and the lilies of the field.","sayings":[{"id":"treasure","ref":"Matthew 6:21","cue":"Treasure in heaven","text":"For where your treasure is, there will your heart be also."},{"id":"seek-and-save","ref":"Luke 19:10","cue":"At the house of Zacchaeus","text":"For the Son of man is come to seek and to save that which was lost."},{"id":"more-abundantly","ref":"John 10:10","cue":"Why he came","text":"I am come that they might have life, and that they might have it more abundantly."},{"id":"lilies","ref":"Matthew 6:28","cue":"The lilies of the field","text":"Consider the lilies of the field, how they grow; they toil not, neither do they spin:"},{"id":"no-thought-morrow","ref":"Matthew 6:34","cue":"About tomorrow","text":"Take therefore no thought for the morrow: for the morrow shall take thought for the things of itself."},{"id":"seek-ye-first","ref":"Matthew 6:33","cue":"What to seek first","text":"But seek ye first the kingdom of God, and his righteousness; and all these things shall be added unto you."},{"id":"let-your-light","ref":"Matthew 5:16","cue":"Letting your light shine","text":"Let your light so shine before men, that they may see your good works, and glorify your Father which is in heaven."}]}],"modes":[{"id":"read","name":"Read","short":"Read it slowly, then reveal it a phrase at a time.","instructions":"Read the saying aloud if you can. Then tap Reveal to bring it back one phrase at a time and say each part before you see it.","action":"Reveal next phrase","done":"Read through"},{"id":"fade","name":"Fade","short":"Words disappear a few at a time.","instructions":"Each round hides a few more words. Say the whole saying, blanks and all, then tap Next round. Tap any blank to peek.","action":"Next round","done":"Every word hidden"},{"id":"letters","name":"First Letters","short":"Only the first letters are left. Type the saying.","instructions":"Each word shows only its first letter. Type the saying from memory. Capitals and punctuation do not matter. Spell thee, thou, ye, hath and shalt as written.","action":"Check","done":"Typed from memory"},{"id":"build","name":"Build","short":"Tap the words in order.","instructions":"The words are shuffled. Tap them in order to build the saying. A wrong tap shakes gently and costs nothing but a moment.","action":"Tap the next word","done":"Built in order"}],"mastery":[{"box":0,"name":"New","note":"Not started yet."},{"box":1,"name":"Learning","note":"Back tomorrow."},{"box":2,"name":"Familiar","note":"Back in a few days."},{"box":3,"name":"Growing","note":"Back in about a week."},{"box":4,"name":"Steady","note":"Back in about two weeks."},{"box":5,"name":"Hidden in your heart","note":"Back in about a month, to keep it fresh."}],"ui":{"appName":"Hide It in Your Heart","brand":"Red Letter","tagline":"A memory game for the words of Jesus","epigraph":"Fifty-five sayings of Jesus, in the King James words, learned a little each day.","nav":{"today":"Today","collections":"Sayings","progress":"Progress","about":"About"},"welcome":{"title":"Welcome","body":["Pick a saying and practice it four ways: read it, watch it fade, type it from its first letters, and build it from shuffled words.","Once you know a saying, it joins your review. It comes back tomorrow, then in a few days, then a week, then longer, right before you would forget it.","A few minutes a day is plenty."],"start":"Start with a short one"},"today":{"title":"Today","dueHeading":"Ready for review","dueCount":((n) => (n === 1 ? '1 saying is ready for review.' : `${n} sayings are ready for review.`)),"noneDue":"Nothing is due right now. Your sayings are resting.","newHeading":"Learn something new","newSuggest":"Here is the next saying in your list.","startReview":"Start review","learnNew":"Learn this saying","allLearned":"You have started every saying. Reviews will keep them fresh.","sessionDone":"That is everything for today.","sessionDoneNote":"Come back tomorrow, or keep practicing any saying you like.","newDone":((n) => (n === 1 ? 'You learned 1 new saying today. That is plenty.' : `You learned ${n} new sayings today. That is plenty.`)),"newDoneNote":"Let them settle. You can raise the daily number in Progress.","nextUp":"Next up"},"review":{"showCue":"Here is the moment. Can you say what he said?","reveal":"Show the saying","rateHeading":"How did that go?","rateAgain":"Not yet","rateAgainNote":"See it again tomorrow","rateHard":"With help","rateHardNote":"Stay at this level","rateGood":"I knew it","rateGoodNote":"Move up a level","typeInstead":"Type it instead","counter":((i, n) => `Saying ${i} of ${n}`),"check":"Check"},"practice":{"back":"Back to sayings","hideToRecall":"Hide it and recall","readAgain":"Read it again","toToday":"Back to today","peeks":((n) => (n === 1 ? '1 peek' : `${n} peeks`)),"mistakes":((n) => (n === 0 ? 'No wrong taps' : n === 1 ? '1 wrong tap' : `${n} wrong taps`)),"score":((got, total) => `${got} of ${total} words`),"nearHeading":"Small typos, counted as right","modeLabel":"Practice mode","nextMode":"Next mode","tryAgain":"Try again","finish":"Finish","peek":"Peek","hint":"Hint","progress":((i, n) => `Round ${i} of ${n}`),"typeLabel":"Type the saying","typePlaceholder":"Type from memory","chipsLabel":"Shuffled ide It in Your Heart helps you memorize the words Jesus spoke, as the King James Version gives them. Every saying is checked word for word against the red-letter text of the four Gospels.","The title comes from Psalm 119:11, \"Thy word have I hid in mine heart.\"","Your progress stays in this browser on this device. Nothing is sent anywhere.","This is a memory aid for personal devotion. It is not a substitute for a church community, pastoral care or professional counseling."],"fonts":"Set in IM Fell English and Literata, both under the SIL Open Font License.","kjvNote":"Scripture from the King James Version (1769), public domain in the United States.","credit":"A Red Letter project."},"a11y":{"skip":"Skip to main content","themeToggle":"Change theme","closeDialog":"Close","blank":((n) => `Hidden word ${n}`),"chip":((w) => `Add the word ${w}`),"removeChip":((w) => `Remove the word ${w}`),"feedbackRegion":"Feedback","masteryOf":((level) => `Mastery: ${level}`),"modeDone":((mode) => `${mode}, done`),"weekStrip":"The last seven days","practicedOn":((day) => `${day}: practiced`),"graceOn":((day) => `${day}: covered by a grace day`),"restOn":((day) => `${day}: rest`)}}};

<script>
(function () {
  'use strict';

  var C = window.__HIDEIT__;
  var ui = C.ui;
  var MODES = C.modes;
  var MASTERY = C.mastery;
  var INTERVALS = [0, 1, 3, 7, 14, 30];
  var KEY = 'redletter.hideit.v1';
  var DAY = 86400000;

  // ---------- Sayings ----------
  var ALL = [];
  var BY_ID = {};
  C.collections.forEach(function (c) {
    c.sayings.forEach(function (s) {
      var x = { id: s.id, ref: s.ref, cue: s.cue, text: s.text, collection: c.id, collectionName: c.name, index: ALL.length };
      ALL.push(x);
      BY_ID[s.id] = x;
    });
  });

  function normWord(w) {
    return String(w).toLowerCase().replace(/[’‘']/g, '').replace(/[^a-z0-9]/g, '');
  }
  // The KJV verse may run on with a colon; the saying is shown without it and
  // a muted ellipsis marks that the verse continues.
  function shown(text) { return text.replace(/[:;,]$/, ''); }
  function runsOn(text) { return /[:;,]$/.test(text); }
  function tokens(text) {
    return shown(text).split(' ').map(function (raw, i) { return { raw: raw, norm: normWord(raw), i: i }; });
  }
  function phrases(toks) {
    var out = [[]];
    toks.forEach(function (t, i) {
      out[out.length - 1].push(t);
      if (/[,;:.?!]$/.test(t.raw) && i < toks.length - 1) out.push([]);
    });
    return out;
  }
  function sizeClass(n) { return n > 24 ? 'size-l' : n > 14 ? 'size-m' : ''; }

  // Deterministic shuffles so a saying behaves the same way each visit.
  function seeded(str) {
    var h = 2166136261;
    for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return function () {
      h = Math.imul(h ^ (h >>> 15), 2246822507);
      h = Math.imul(h ^ (h >>> 13), 3266489909);
      h ^= h >>> 16;
      return (h >>> 0) / 4294967296;
    };
  }
  function shuffle(arr, rnd) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(rnd() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }

  // ---------- Clock ----------
  function now() { return typeof window.__hideItNow === 'number' ? window.__hideItNow : Date.now(); }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function keyOf(ms) { var d = new Date(ms); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function today() { return keyOf(now()); }
  function parseKey(k) { var p = k.split('-'); return Date.UTC(+p[0], +p[1] - 1, +p[2]); }
  function addDays(k, n) { var d = new Date(parseKey(k) + n * DAY); return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()); }
  function diffDays(a, b) { return Math.round((parseKey(b) - parseKey(a)) / DAY); }
  function weekday(k) { return ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][new Date(parseKey(k)).getUTCDay()]; }

  // ---------- Storage ----------
  var memory = null;
  var storageOK = true;
  function fresh() {
    return { v: 1, sayings: {}, streak: { count: 0, last: null, grace: [], days: [] }, settings: { theme: 'auto', motion: false, newPerDay: 3 }, learnedOn: {} };
  }
  function isObj(v) { return !!v && typeof v === 'object' && !Array.isArray(v); }
  function load() {
    var raw = null, s = null;
    try {
      raw = window.localStorage.getItem(KEY);
      window.localStorage.setItem(KEY + '.probe', '1');
      window.localStorage.removeItem(KEY + '.probe');
    } catch (e) { storageOK = false; }
    // Unreadable saved data is set aside; storage itself still works.
    if (raw) { try { s = JSON.parse(raw); } catch (e) { s = null; } }
    var base = fresh();
    if (!isObj(s)) return base;
    // Take only fields of the right shape, so data from an older or newer
    // version (or a half-written save) can never stop the app from starting.
    if (isObj(s.sayings)) {
      Object.keys(s.sayings).forEach(function (id) {
        var r = s.sayings[id];
        if (!isObj(r)) return;
        var box = Math.max(0, Math.min(5, Math.floor(+r.box) || 0));
        base.sayings[id] = {
          box: box,
          due: typeof r.due === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(r.due) ? r.due : (box > 0 ? today() : null),
          modes: isObj(r.modes) ? r.modes : {},
          reviews: +r.reviews || 0,
          lapses: +r.lapses || 0,
        };
        if (typeof r.last === 'string') base.sayings[id].last = r.last;
      });
    }
    if (isObj(s.streak)) {
      var st = s.streak;
      base.streak.count = Math.max(0, Math.floor(+st.count) || 0);
      base.streak.last = typeof st.last === 'string' ? st.last : null;
      base.streak.grace = Array.isArray(st.grace) ? st.grace.filter(function (k) { return typeof k === 'string'; }) : [];
      base.streak.days = Array.isArray(st.days) ? st.days.filter(function (k) { return typeof k === 'string'; }) : [];
    }
    if (isObj(s.settings)) {
      var se = s.settings;
      if (se.theme === 'auto' || se.theme === 'light' || se.theme === 'dark') base.settings.theme = se.theme;
      if (typeof se.motion === 'boolean') base.settings.motion = se.motion;
      var npd = Math.floor(+se.newPerDay);
      if (npd >= 1 && npd <= 20) base.settings.newPerDay = npd;
    }
    if (isObj(s.learnedOn)) Object.keys(s.learnedOn).forEach(function (k) { var v = +s.learnedOn[k]; if (v >= 0) base.learnedOn[k] = v; });
    return base;
  }
  function save() {
    memory = JSON.stringify(state);
    try { window.localStorage.setItem(KEY, memory); } catch (e) { storageOK = false; }
  }
  var state = load();

  function rec(id) {
    if (!state.sayings[id]) state.sayings[id] = { box: 0, due: null, modes: {}, reviews: 0, lapses: 0 };
    return state.sayings[id];
  }
  function boxOf(id) { return state.sayings[id] ? state.sayings[id].box : 0; }
  function started(id) { var r = state.sayings[id]; return !!(r && (r.box > 0 || Object.keys(r.modes || {}).length)); }
  function dueList() {
    var t = today();
    return ALL.filter(function (s) { var r = state.sayings[s.id]; return r && r.box > 0 && r.due && r.due <= t; })
      .sort(function (a, b) { return state.sayings[a.id].due < state.sayings[b.id].due ? -1 : state.sayings[a.id].due > state.sayings[b.id].due ? 1 : a.index - b.index; });
  }
  function nextNew() { for (var i = 0; i < ALL.length; i++) if (boxOf(ALL[i].id) === 0) return ALL[i]; return null; }
  function learnedToday() { return state.learnedOn[today()] || 0; }

  // ---------- Streak ----------
  function graceLeft(t) {
    var used = state.streak.grace.filter(function (d) { var g = diffDays(d, t); return g > 0 && g <= 7; }).length;
    return Math.max(0, 2 - used);
  }
  function markActivity() {
    var t = today();
    var s = state.streak;
    if (s.last === t) return null;
    var msg = null;
    if (!s.last) s.count = 1;
    else {
      var gap = diffDays(s.last, t) - 1;
      if (gap <= 0) s.count += 1;
      else if (gap <= graceLeft(t)) {
        for (var k = 1; k <= gap; k++) s.grace.push(addDays(s.last, k));
        s.count += 1;
        msg = ui.streak.graceUsed;
      } else { s.count = 1; msg = ui.streak.restarted; }
    }
    s.last = t;
    if (s.days.indexOf(t) < 0) s.days.push(t);
    s.days = s.days.slice(-90);
    s.grace = s.grace.slice(-30);
    return msg;
  }
  function streakNow() {
    var s = state.streak;
    if (!s.last) return 0;
    var gap = diffDays(s.last, today()) - 1;
    if (gap <= 0) return s.count;
    return gap <= graceLeft(today()) ? s.count : 0;
  }

  // ---------- Scheduling ----------
  function learnSaying(id) {
    var r = rec(id);
    if (r.box > 0) return false;
    r.box = 1;
    r.due = addDays(today(), INTERVALS[1]);
    r.learned = today();
    var n = learnedToday();
    state.learnedOn = {};
    state.learnedOn[today()] = n + 1;
    return true;
  }
  function rate(id, how) {
    var r = rec(id);
    r.reviews += 1;
    if (how === 'again') { r.box = 1; r.lapses += 1; }
    else if (how === 'good') r.box = Math.min(5, Math.max(1, r.box) + 1);
    else r.box = Math.max(1, r.box);
    r.due = addDays(today(), INTERVALS[r.box]);
    r.last = today();
    return r;
  }

  // ---------- Typing check ----------
  function lev(a, b) {
    if (Math.abs(a.length - b.length) > 1) return 2;
    var prev = [], cur = [];
    for (var j = 0; j <= b.length; j++) prev[j] = j;
    for (var i = 1; i <= a.length; i++) {
      cur = [i];

  var ARCHAIC = { shalt: 1, hast: 1, hadst: 1, wast: 1, wilt: 1, art: 1, doth: 1, dost: 1, saith: 1, thine: 1, thee: 1, thou: 1, thy: 1, ye: 1, hath: 1, canst: 1, couldest: 1, didst: 1, shouldest: 1, wouldest: 1, knowest: 1, sayest: 1, mayest: 1, seest: 1, lovest: 1, unto: 1, alway: 1 };

      if (res.missed) h += '<p class="small muted" style="margin-top:8px">' + esc(ui.feedback.missedHeading) + '</p>';
      else h += '<p class="small muted" style="margin-top:8px">' + esc(ui.practice.nearHeading) + '</p>';
      h += '<p class="diff">' + res.tokens.map(function (t, i) {
        var k = res.marks[i];
        return k === 'ok' ? esc(t.raw) : '<span class="w-' + k + '">' + esc(t.raw) + '</span>';
      }).join(' ') + '</p>';
    }
    if (res.extra.length) h += '<p class="extra">' + esc(ui.feedback.extraHeading) + ': ' + res.extra.map(function (w) { return '<s>' + esc(w) + '</s>'; }).join(', ') + '</p>';
    return h + '</div>';
  }
  function typeBox(id) {
    return '<label class="field-label" for="' + id + '">' + esc(ui.practice.typeLabel) + '</label>' +
      '<textarea class="type-area" id="' + id + '" rows="3" placeholder="' + esc(ui.practice.typePlaceholder) + '" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done"></textarea>';
  }
  function bindEnter(ta, fn) {
    var fit = function () { ta.style.height = 'auto'; ta.style.height = Math.max(96, ta.scrollHeight + 2) + 'px'; };
    ta.addEventListener('input', fit);
    fit();
    ta.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); fn(); } });
  }

  STAGES.letters = function (s) {
    var p = session;
    var stage = document.getElementById('stage');
    var h = sayingHTML(s, '<span aria-hidden="true">' + lettersInner(p.toks) + '</span><span class="sr-only">' + esc(p.toks.map(function (t) { return t.raw.charAt(0); }).join(' ')) + '</span>') + cite(s);
    h += typeBox('typed');
    h += '<div class="controls"><button class="btn primary" type="button" data-act="check" data-test="check">' + esc(MODES[2].action) + '</button><span class="kbd-hint">Enter</span></div><div id="res"></div>';
    stage.innerHTML = h;
    var ta = stage.querySelector('textarea');
    if (p.typed) ta.value = p.typed;
    function check() {
      p.typed = ta.value;
      if (!ta.value.trim()) { ta.focus(); return; }
      var res = checkTyped(s.text, ta.value);
      p.lastResult = res;
      document.getElementById('res').innerHTML = resultHTML(res);
      var verdict = res.verdict === 'perfect' ? ui.feedback.perfect : res.verdict === 'close' ? ui.feedback.close(res.missed) : ui.feedback.keepGoing;
      say(document.getElementById('fb'), verdict, res.verdict === 'perfect');
      if (res.verdict === 'perfect' && !p.completed) {
        completeMode(s, 'letters', MODES[2].done + '.');
        var nm = $main.querySelector('[data-test="next-mode"]'); if (nm) nm.focus();
      }
    }
    stage.querySelector('[data-act="check"]').addEventListener('click', check);
    bindEnter(ta, check);
    if (p.lastResult) document.getElementById('res').innerHTML = resultHTML(p.lastResult);
  };

  STAGES.build = function (s) {
    var p = session;
    var stage = document.getElementById('stage');
    function draw(focusIdx) {
      var placed = p.placed.map(function (i) { return esc(p.toks[i].raw); }).join(' ');
      var done = p.placed.length === p.toks.length;
      var h = '<p class="sr-only" id="built-l">' + esc(ui.practice.builtLabel) + '</p>';
      h += '<div class="built' + (done ? ' done' : '') + '" aria-labelledby="built-l" data-empty="' + esc(MODES[3].action) + '" data-test="built">' + placed + (done && runsOn(s.text) ? '<span class="trail" aria-hidden="true" style="color:var(--muted)"> …</span>' : '') + '</div>';
      if (done) h += cite(s);
      h += done ? '<div>' : '<div class="chips" role="group" aria-label="' + esc(ui.practice.chipsLabel) + '">';
      p.pool.forEach(function (i, k) {
        if (p.placed.indexOf(i) >= 0) return;
        h += '<button type="button" class="chip" data-i="' + i + '" data-k="' + k + '" aria-label="' + esc(ui.a11y.chip(p.toks[i].raw)) + '">' + esc(p.toks[i].raw) + '</button>';
      });
      h += '</div><div class="controls">';
      if (!done) {
        h += '<button class="btn quiet" type="button" data-act="undo"' + (p.placed.length ? '' : ' disabled') + '>' + esc(ui.practice.undo) + '</button>';
        h += '<span class="counter grow" data-test="mistakes">' + esc(ui.practice.mistakes(p.mistakes)) + '</span>';
      } else h += '<span class="counter" data-test="mistakes">' + esc(ui.practice.mistakes(p.mistakes)) + '</span>';
      stage.innerHTML = h + '</div>';
      stage.querySelectorAll('.chip').forEach(function (b) { b.addEventListener('click', function () { tap(+b.getAttribute('data-i'), b); }); });
      var u = stage.querySelector('[data-act="undo"]');
      if (u) u.addEventListener('click', function () { p.placed.pop(); draw(); var f = stage.querySelector('.chip'); if (f) f.focus(); });
      if (typeof focusIdx === 'number') {
        var chips = stage.querySelectorAll('.chip');
        if (chips.length) chips[Math.min(focusIdx, chips.length - 1)].focus();
      }
    }
    function tap(i, btn) {
      var want = p.toks[p.placed.length];
      if (p.toks[i].norm === want.norm) {
        // Equal words (two "the"s) are interchangeable; place in text order.
        var k = Array.prototype.indexOf.call(stage.querySelectorAll('.chip'), btn);
        p.placed.push(want.i === i ? i : swapEqual(i, want.i));
        draw(k);
        if (p.placed.length === p.toks.length) {
          say(document.getElementById('fb'), ui.feedback.builtCorrect, true);
          completeMode(s, 'build', MODES[3].done + '. ' + ui.practice.mistakes(p.mistakes) + '.');
          var f = $main.querySelector('[data-test="finish"]'); if (f) f.focus();
        }
      } else {
        p.mistakes++;
        btn.classList.remove('wrong'); void btn.offsetWidth; btn.classList.add('wrong');
        var c = stage.querySelector('[data-test="mistakes"]'); if (c) c.textContent = ui.practice.mistakes(p.mistakes);
        say(document.getElementById('fb'), ui.feedback.wrongChip, false, true);
      }
    }
    function swapEqual(tapped, wanted) {
      var a = p.pool.indexOf(tapped), b = p.pool.indexOf(wanted);
      p.pool[a] = wanted; p.pool[b] = tapped;
      return wanted;
    }
    draw();
  };

  // ---------- Review ----------
  VIEWS.review = function () {
    if (!session || session.kind !== 'review') {
      var q = dueList().map(function (s) { return s.id; });
      session = { kind: 'review', queue: q, i: 0, revealed: false, typing: false, result: null, done: 0 };
    }
    var p = session;
    var h = '<a class="back" href="#/today"><span aria-hidden="true">←</span> ' + esc(ui.practice.toToday) + '</a>';
    if (p.i >= p.queue.length) {
      h += '<div class="card" style="margin-top:14px" data-test="review-done"><h1 class="view-title">' + esc(ui.today.sessionDone) + '</h1><p class="muted">' + esc(ui.today.sessionDoneNote) + '</p>';
      h += '<div class="row-gap" style="margin-top:6px"><a class="btn primary" href="#/today">' + esc(ui.practice.toToday) + '</a><a class="btn" href="#/sayings">' + esc(ui.nav.collections) + '</a></div></div>';
      $main.innerHTML = h;
      return;
    }
    var s = BY_ID[p.queue[p.i]];
    var r = rec(s.id);
    h += '<div class="progress-line" aria-hidden="true"><i style="width:' + (100 * p.i / p.queue.length).toFixed(1) + '%"></i></div>';
    h += '<section class="card stage" aria-labelledby="rv-h"><div class="row-gap" style="justify-content:space-between"><p class="eyebrow" style="margin:0" data-test="review-counter">' + esc(ui.review.counter(p.i + 1, p.queue.length)) + '</p><span class="badge">' + pips(r.box) + ' ' + esc(MASTERY[r.box].name) + '</span></div>';
    h += '<h1 class="review-cue" id="rv-h">' + esc(s.cue) + '</h1><p class="ref">' + esc(s.ref) + ' · ' + esc(s.collectionName) + '</p>';
    if (!p.revealed) {
      h += '<p class="review-prompt" style="margin-top:18px">' + esc(ui.review.showCue) + '</p>';
      if (p.typing) {
        h += typeBox('rv-typed') + '<div class="controls"><button class="btn primary" type="button" data-act="check" data-test="rv-check">' + esc(ui.review.check) + '</button><button class="btn quiet" type="button" data-act="show">' + esc(ui.review.reveal) + '</button></div>';
      } else {
        h += '<div class="controls"><button class="btn primary" type="button" data-act="show" data-test="rv-show">' + esc(ui.review.reveal) + '</button><button class="btn" type="button" data-act="type" data-test="rv-type">' + esc(ui.review.typeInstead) + '</button></div>';
      }
    } else {
      h += '<div style="margin-top:20px">' + sayingHTML(s, esc(shown(s.text))) + (p.result ? resultHTML(p.result) : '') + '</div>';
      h += '<p class="eyebrow" style="margin-top:22px" id="rate-h">' + esc(ui.review.rateHeading) + '</p><div class="rate" role="group" aria-labelledby="rate-h">';
      [['again', ui.review.rateAgain, ui.review.rateAgainNote], ['hard', ui.review.rateHard, ui.review.rateHardNote], ['good', ui.review.rateGood, ui.review.rateGoodNote]].forEach(function (b) {
        var suggest = p.result && ((p.result.verdict === 'perfect' && b[0] === 'good') || (p.result.verdict === 'close' && b[0] === 'hard') || (p.result.verdict === 'keepGoing' && b[0] === 'again'));
        h += '<button class="btn' + (suggest || (!p.result && b[0] === 'good') ? ' primary' : '') + '" type="button" data-rate="' + b[0] + '" data-test="rate-' + b[0] + '">' + esc(b[1]) + '<span>' + esc(b[2]) + '</span></button>';
      });
      h += '</div>';
    }
    h += '<p class="feedback sr-only" id="fb" role="status" aria-live="polite"></p></section>';
    $main.innerHTML = h;
    var showB = $main.querySelector('[data-act="show"]');
    if (showB) showB.addEventListener('click', function () { p.revealed = true; VIEWS.review(); focusFirst('[data-rate="good"]'); });
    var typeB = $main.querySelector('[data-act="type"]');
    if (typeB) typeB.addEventListener('click', function () { p.typing = true; VIEWS.review(); focusFirst('textarea'); });
    var ta = $main.querySelector('textarea');
    if (ta) {
      var check = function () {
        if (!ta.value.trim()) return ta.focus();
        p.result = checkTyped(s.text, ta.value);
        p.revealed = true;
        VIEWS.review();
        var v = p.result.verdict === 'perfect' ? ui.feedback.perfect : p.result.verdict === 'close' ? ui.feedback.close(p.result.missed) : ui.feedback.keepGoing;
        say(document.getElementById('fb'), v, p.result.verdict === 'perfect');
        focusFirst('.rate .btn.primary');
      };
      $main.querySelector('[data-act="check"]').addEventListener('click', check);
      bindEnter(ta, check);
    }
    $main.querySelectorAll('[data-rate]').forEach(function (b) {
      b.addEventListener('click', function () {
        var how = b.getAttribute('data-rate');
        var rr = rate(s.id, how);
        var streakMsg = markActivity();
        save();
        var msg = how === 'good' ? ui.feedback.levelUp(MASTERY[rr.box].name) : how === 'hard' ? ui.feedback.stayed : ui.feedback.again;
        toast(streakMsg ? streakMsg + ' ' + msg : msg);
        p.i++; p.revealed = false; p.typing = false; p.result = null; p.done++;
        VIEWS.review();
        renderStreakPill();
        focusFirst('[data-act="show"], [data-test="review-done"] a');
      });
    });
  };
  function focusFirst(sel) { var el = $main.querySelector(sel); if (el) el.focus(); }

  // ---------- Progress ----------
  VIEWS.progress = function () {
    session = null;
    var startedN = ALL.filter(function (s) { return started(s.id); }).length;
    var mastered = ALL.filter(function (s) { return boxOf(s.id) === 5; }).length;
    var due = dueList().length;
    var h = '<h1 class="view-title">' + esc(ui.progress.title) + '</h1>';
    if (!storageOK) h += '<p class="confirm small" data-test="storage-off" style="margin:10px 0 0">' + esc(ui.progress.storageOff) + '</p>';
    h += '<div class="stats">';
    h += '<div class="stat"><div class="num" data-test="started">' + startedN + '</div><div class="lbl">' + esc(ui.progress.learned(startedN, ALL.length)) + '</div></div>';
    h += '<div class="stat"><div class="num">' + mastered + '</div><div class="lbl">' + esc(ui.progress.mastered(mastered)) + '</div></div>';
    h += '<div class="stat"><div class="num">' + streakNow() + '</div><div class="lbl">' + esc(ui.streak.label) + '</div></div>';
    h += '</div>';
    // By collection
    h += '<section class="card" aria-labelledby="bc-h" style="margin-top:16px"><h2 id="bc-h">' + esc(ui.progress.byCollection) + '</h2><ul class="bars">';
    C.collections.forEach(function (c) {
      var n = c.sayings.length;
      var segs = '';
      for (var b = 5; b >= 1; b--) {
        var k = c.sayings.filter(function (s) { return boxOf(s.id) === b; }).length;
        if (k) segs += '<i style="width:' + (100 * k / n).toFixed(2) + '%;opacity:' + (0.25 + 0.15 * b).toFixed(2) + '" title="' + esc(MASTERY[b].name) + ': ' + k + '"></i>';
      }
      var inReview = c.sayings.filter(function (s) { return boxOf(s.id) > 0; }).length;
      h += '<li><span>' + esc(c.name) + '</span><span class="bar" role="img" aria-label="' + esc(c.name + ': ' + ui.progress.learned(inReview, n)) + '">' + segs + '</span><span class="n">' + inReview + '/' + n + '</span></li>';
    });
    h += '</ul><div class="legend" aria-hidden="true">';
    for (var b = 1; b <= 5; b++) h += '<span><i style="opacity:' + (0.25 + 0.15 * b).toFixed(2) + '"></i>' + esc(MASTERY[b].name) + '</span>';
    h += '</div></section>';
    // Upcoming
    var up = ALL.filter(function (s) { return boxOf(s.id) > 0; }).sort(function (a, b) { var x = state.sayings[a.id].due, y = state.sayings[b.id].due; return x < y ? -1 : x > y ? 1 : a.index - b.index; }).slice(0, 8);
    if (up.length) {
      h += '<section class="card" aria-labelledby="up-h"><h2 id="up-h">' + esc(ui.progress.nextReview) + '</h2><ul class="upcoming">';
      up.forEach(function (s) {
        var d = diffDays(today(), state.sayings[s.id].due);
        h += '<li><span><span class="ref">' + esc(s.ref) + '</span><br><span class="small">' + esc(s.cue) + '</span></span><span class="when">' + esc(d <= 0 ? ui.progress.dueNow : ui.progress.dueIn(d)) + '</span></li>';
      });
      h += '</ul>' + (due ? '<a class="btn primary" href="#/review">' + esc(ui.today.startReview) + '</a>' : '') + '</section>';
    }
    // Settings
    var st = state.settings;
    h += '<section class="card" aria-labelledby="set-h"><h2 id="set-h">' + esc(ui.settings.title) + '</h2>';
    h += '<div class="setting"><span id="theme-l">' + esc(ui.settings.theme) + '</span><div class="seg" role="group" aria-labelledby="theme-l">';
    [['auto', ui.settings.themeAuto], ['light', ui.settings.themeLight], ['dark', ui.settings.themeDark]].forEach(function (o) {
      h += '<button type="button" data-theme-set="' + o[0] + '" aria-pressed="' + (st.theme === o[0]) + '">' + esc(o[1]) + '</button>';
    });
    h += '</div></div>';
    h += '<div class="setting"><span id="motion-l">' + esc(ui.settings.motion) + '</span><button type="button" class="switch" role="switch" aria-checked="' + !!st.motion + '" aria-labelledby="motion-l" data-act="motion"></button></div>';
    h += '<div class="setting"><span id="npd-l">' + esc(ui.settings.newPerDay) + '</span><div class="stepper" role="group" aria-labelledby="npd-l"><button type="button" data-npd="-1" aria-label="−">−</button><output aria-live="polite">' + st.newPerDay + '</output><button type="button" data-npd="1" aria-label="+">+</button></div></div>';
    h += '<div class="setting"><span></span><button type="button" class="btn quiet danger" data-act="reset" data-test="reset">' + esc(ui.progress.reset) + '</button></div>';
    h += '<div id="confirm"></div></section>';
    $main.innerHTML = h;

    $main.querySelectorAll('[data-theme-set]').forEach(function (b) {
      b.addEventListener('click', function () { st.theme = b.getAttribute('data-theme-set'); save(); applySettings(); VIEWS.progress(); focusFirst('[data-theme-set="' + st.theme + '"]'); });
    });
    $main.querySelector('[data-act="motion"]').addEventListener('click', function () { st.motion = !st.motion; save(); applySettings(); VIEWS.progress(); focusFirst('[data-act="motion"]'); });
    $main.querySelectorAll('[data-npd]').forEach(function (b) {
      b.addEventListener('click', function () { st.newPerDay = Math.min(10, Math.max(1, st.newPerDay + +b.getAttribute('data-npd'))); save(); $main.querySelector('.stepper output').textContent = st.newPerDay; });
    });
    $main.querySelector('[data-act="reset"]').addEventListener('click', function () {
      var c = document.getElementById('confirm');
      c.innerHTML = '<div class="confirm" role="alertdialog" aria-labelledby="cf-t"><p id="cf-t">' + esc(ui.progress.resetConfirm) + '</p><div class="row-gap" style="margin-top:10px"><button type="button" class="btn primary" data-act="yes" data-test="reset-yes">' + esc(ui.progress.reset) + '</button><button type="button" class="btn" data-act="no">' + esc(ui.a11y.closeDialog) + '</button></div></div>';
      c.querySelector('[data-act="no"]').addEventListener('click', function () { c.innerHTML = ''; focusFirst('[data-act="reset"]'); });
      c.querySelector('[data-act="yes"]').addEventListener('click', function () {
        var keep = state.settings;
        state = fresh(); state.settings = keep; save();
        VIEWS.progress(); renderStreakPill(); toast(ui.progress.resetDone);
      });
      c.querySelector('[data-act="no"]').focus();
    });
  };

  // ---------- About ----------
  VIEWS.about = function () {
    session = null;
    var h = '<h1 class="view-title">' + esc(ui.about.title) + '</h1><p class="epigraph" style="margin:8px 0 22px">' + esc(ui.tagline) + '</p><div class="prose">';
    ui.about.body.forEach(function (p) { h += '<p>' + esc(p) + '</p>'; });
    h += '</div><div class="colophon"><p>' + esc(ui.about.kjvNote) + '</p><p>' + esc(ui.about.fonts) + '</p><p>' + esc(ui.about.credit) + '</p></div>';
    $main.innerHTML = h;
  };

  // ---------- Start ----------
  applySettings();
  window.addEventListener('hashchange', route);
  if (!location.hash) history.replaceState(null, '', '#/today');
  route();

  // A small hook for the automated test and for curious players.
  window.HideIt = {
    state: function () { return JSON.parse(JSON.stringify(state)); },
    storageOK: function () { return storageOK; },
    rerender: route,
    checkTyped: checkTyped,
    toast: toast,
    today: today,
    count: ALL.length
  };
})();

</script>
</body>
</html>
