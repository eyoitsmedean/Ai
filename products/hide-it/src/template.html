<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="{{TAGLINE}}">
<title>{{TITLE}}</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23a3142c'/%3E%3Cpath d='M16 25s-8-5.2-8-10.6A4.4 4.4 0 0 1 16 12a4.4 4.4 0 0 1 8 2.4C24 19.8 16 25 16 25z' fill='%23f6f3ee'/%3E%3C/svg%3E">
<style>
{{FONTS}}
{{CSS}}
</style>
</head>
<body>
<a class="skip" href="#main">{{SKIP}}</a>
<header class="masthead">
  <div class="masthead-inner">
    <a class="brand" href="#/today" aria-label="{{TITLE}}, {{NAV_TODAY}}">
      <span class="brand-kicker">{{BRAND}}</span>
      <span class="brand-title">{{TITLE}}</span>
    </a>
    <div class="streak-pill" id="streak-pill" aria-live="off"></div>
  </div>
  <nav class="tabs" aria-label="Main">
    <a href="#/today" data-nav="today">{{NAV_TODAY}}</a>
    <a href="#/sayings" data-nav="sayings">{{NAV_SAYINGS}}</a>
    <a href="#/progress" data-nav="progress">{{NAV_PROGRESS}}</a>
    <a href="#/about" data-nav="about">{{NAV_ABOUT}}</a>
  </nav>
</header>
<main id="main" tabindex="-1"></main>
<div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
<noscript><p class="noscript">This memory game needs JavaScript turned on.</p></noscript>
<script>
window.__HIDEIT__ = {{DATA}};
</script>
<script>
{{JS}}
</script>
</body>
</html>
